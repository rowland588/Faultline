name: Installed app update verification
on:
  pull_request:
    paths:
      - 'src/lib/appUpdate.ts'
      - 'src/lib/__tests__/appUpdate.test.ts'
      - 'src/ui/BuildStamp.tsx'
      - 'src/ui/UpdateBanner.tsx'
      - 'vite.config.ts'
      - 'scripts/pwa-update.mjs'
      - '.github/workflows/app-update-verification.yml'
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Test update recovery
        run: npx vitest run src/lib/__tests__/appUpdate.test.ts
      - name: Test real installed app update and offline restart
        run: |
          export CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node scripts/pwa-update.mjs
