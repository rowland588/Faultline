name: Full release verification
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  core:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/ui-review-improvements'
    uses: ./.github/workflows/release-gate-part.yml
    with:
      phase: core
  verify:
    needs: core
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - { phase: smoke, shard: 0 }
          - { phase: inventory, shard: 0 }
          - { phase: structure, shard: 0 }
          - { phase: journeys, shard: 0 }
          - { phase: papers, shard: 0 }
          - { phase: acceptance, shard: 0 }
          - { phase: acceptance, shard: 1 }
          - { phase: acceptance, shard: 2 }
          - { phase: acceptance, shard: 3 }
          - { phase: acceptance, shard: 4 }
          - { phase: acceptance, shard: 5 }
          - { phase: fuzz, shard: 0 }
          - { phase: fuzz, shard: 1 }
          - { phase: fuzz, shard: 2 }
          - { phase: fuzz, shard: 3 }
          - { phase: solo, shard: 0 }
    uses: ./.github/workflows/release-gate-part.yml
    with:
      phase: ${{ matrix.phase }}
      shard-index: ${{ matrix.shard }}
      shard-count: 6
  sync:
    needs: verify
    uses: ./.github/workflows/release-gate-part.yml
    with:
      phase: sync
  release:
    if: always()
    needs: [core, verify, sync]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate phase must pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(j['result'] in ('success', 'skipped') for j in results.values()), results
          if any(j['result'] == 'success' for j in results.values()):
              assert all(j['result'] == 'success' for j in results.values()), results
          print('Full release gate passed: core, every screen/story/report, all 40 fuzz seeds and two-device sync.')
          PYCODE
