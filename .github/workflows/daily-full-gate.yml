# Full gate once a day on main — docs/STATE.md §4, CLAUDE.md “The gate”.
# Replaces relying on an external scheduled task alone: checks out main, one dev
# server on 5191, same checkout for change and “live” (paper parity is same tree).
name: Daily full gate

on:
  schedule:
    # 05:46 UTC — matches 05:46 Europe/London when the UK is on GMT (winter).
    - cron: '46 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-full-gate
  cancel-in-progress: false

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # THE SAME TOOLS AS THE RELEASE GATE (20 November): this job had no pdftotext, so every story that reads a paper back failed with
      # "spawnSync pdftotext ENOENT" and the daily gate was red for a reason that was never the app's. The browser, Poppler and ffmpeg
      # as release-gate-part.yml installs them, the same pinned Poppler (Ubuntu's older one joins words in these embedded-font PDFs).
      - name: Install browser and PDF tools
        run: |
          npx playwright install chromium --with-deps
          sudo apt-get update
          sudo apt-get install -y poppler-utils ffmpeg jq
          browser=$(node --input-type=module -e "import { chromium } from 'playwright'; process.stdout.write(chromium.executablePath());")
          echo "CHROMIUM=$browser" >> "$GITHUB_ENV"
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$browser" /opt/pw-browsers/chromium
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pdf-tools
          create-args: poppler=25.07.0
          cache-environment: true
      - name: Use pinned PDF inspection tools
        shell: bash -el {0}
        run: |
          pdf_bin=$(command -v pdftotext)
          echo "$(dirname "$pdf_bin")" >> "$GITHUB_PATH"
          pdftotext -v 2>&1 | grep -F "version 25.07.0"

      - name: Start dev server (port 5191)
        run: |
          VITE_SUPABASE_URL=https://testproj.supabase.co VITE_SUPABASE_ANON_KEY=testkey \
            npx vite --port 5191 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:5191/" >/dev/null 2>&1; then
              echo "Dev server ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Dev server did not become ready in time"
          exit 1

      - name: Full gate
        run: scripts/gate.sh full "$GITHUB_WORKSPACE" 5191 "$GITHUB_WORKSPACE" 5191 "$RUNNER_TEMP/gate-out"
        env:
          SMOKE_SUPABASE_REF: testproj

      # WHAT FAILED, IN THE LOG ITSELF (20 November — a red run on main could not be diagnosed: the log ended at "exit code 1" and
      # the summary was only in the uploaded artifact, which a session that cannot reach GitHub's file store cannot open). The
      # summary, then the last lines of each failing step's own log, in the run's log and on its summary page.
      - name: What failed
        if: always()
        run: |
          O="$RUNNER_TEMP/gate-out"
          [ -f "$O/summary.txt" ] || { echo "No summary — the gate stopped before writing one."; exit 0; }
          cat "$O/summary.txt"
          { echo "## Daily full gate"; echo '```'; cat "$O/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep '^FAIL' "$O/summary.txt" | while read -r _ kind name _; do
            step="$kind"; [ "$kind" = "acceptance" ] && step="acceptance_$name"
            for f in "$O/$step.log" "$O/${step// /_}.log"; do
              [ -f "$f" ] || continue
              echo "::group::$f (last 60 lines)"; tail -60 "$f"; echo "::endgroup::"
              { echo "### ${step}"; echo '```'; grep -E '^FAIL|Error|rror:' "$f" | head -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              break
            done
          done

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-full-${{ github.run_id }}
          path: ${{ runner.temp }}/gate-out/
          if-no-files-found: warn
