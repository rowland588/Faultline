# APPLY A DATABASE CHANGE FROM THE REPOSITORY (21 November — Rowland: "set up the GitHub database job too"). The Supabase connector
# asks the person before every change and that question cannot reach the Claude app, so a change written to supabase/<NAME>.sql is
# applied here instead: Actions › Apply a database change › Run workflow, the file's name, the branch it is on. scripts/db-apply.mjs
# checks it (the house shape, never one of the four files that move the database backwards), runs it as one query — all or none —
# shows what it prints back, and adds it to Supabase's own record of changes. Run it on the branch the change is on BEFORE the app that
# needs it reaches main (CLAUDE.md, "Database changes ship from here").
#
# Uses the repository secret SUPABASE_ACCESS_TOKEN — the one the function deploys use; never printed, never written anywhere.
name: Apply a database change

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'The change, by its file in supabase/ — e.g. APP_SETTINGS.sql'
        required: true

concurrency:
  group: database-change
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: eqdigvzbljofxznqtfia
      CHANGE_FILE: ${{ inputs.file }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set in the repository's secrets — nothing applied."
            exit 1
          fi

      - name: Check the change
        run: node scripts/db-apply.mjs --check "supabase/$CHANGE_FILE"

      - name: Apply it, read it back, record it
        run: node scripts/db-apply.mjs "supabase/$CHANGE_FILE"
