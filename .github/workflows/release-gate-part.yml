name: Release gate phase
on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string
      shard-index:
        type: number
        default: 0
      shard-count:
        type: number
        default: 6
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser and PDF tools
        if: inputs.phase != 'core'
        run: |
          npx playwright install chromium --with-deps
          sudo apt-get update
          sudo apt-get install -y poppler-utils ffmpeg
          browser=$(node --input-type=module -e "import { chromium } from 'playwright'; process.stdout.write(chromium.executablePath());")
          echo "CHROMIUM=$browser" >> "$GITHUB_ENV"
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$browser" /opt/pw-browsers/chromium
      # Ubuntu's older Poppler joins words in these embedded-font PDFs; use the same
      # generation as the review workspace so text assertions inspect the actual words.
      - uses: mamba-org/setup-micromamba@v2
        if: inputs.phase != 'core'
        with:
          environment-name: pdf-tools
          create-args: poppler=25.07.0
          cache-environment: true
      - name: Use pinned PDF inspection tools
        if: inputs.phase != 'core'
        shell: bash -el {0}
        run: |
          pdf_bin=$(command -v pdftotext)
          echo "$(dirname "$pdf_bin")" >> "$GITHUB_PATH"
          pdftotext -v 2>&1 | grep -F "version 25.07.0"
      - name: Prepare live-code baseline
        if: inputs.phase == 'papers'
        run: |
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/faultline-live" origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/faultline-live/node_modules"
          # Only fixture setup is shared. The baseline application stays at origin/main.
          cp scripts/report-stress.mjs "$RUNNER_TEMP/faultline-live/scripts/report-stress.mjs"
          cp scripts/lib/seedPage.mjs "$RUNNER_TEMP/faultline-live/scripts/lib/seedPage.mjs"
          cp scripts/lib/pageHeader.mjs "$RUNNER_TEMP/faultline-live/scripts/lib/pageHeader.mjs"
          python3 - "$RUNNER_TEMP/faultline-live/vite.config.ts" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          p.write_text(p.read_text().replace('export default defineConfig({', "export default defineConfig({\n  cacheDir: '/tmp/faultline-live-vite-cache',"))
          PY
      - name: Start test servers
        if: inputs.phase != 'core'
        env:
          VITE_SUPABASE_URL: https://testproj.supabase.co
          VITE_SUPABASE_ANON_KEY: testkey
        run: |
          npx vite --port 5191 --strictPort --host 127.0.0.1 > "$RUNNER_TEMP/target-vite.log" 2>&1 &
          ports="5191"
          if [ "${{ inputs.phase }}" = papers ]; then
            (cd "$RUNNER_TEMP/faultline-live" && npx vite --port 5193 --strictPort --host 127.0.0.1 > "$RUNNER_TEMP/baseline-vite.log" 2>&1) &
            ports="5191 5193"
          fi
          for port in $ports; do
            ready=0
            for i in $(seq 1 90); do
              if curl -sf "http://127.0.0.1:$port/" >/dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/"*vite.log; exit 1; fi
          done
      - name: Run the gate phase
        env:
          SMOKE_SUPABASE_REF: testproj
          GATE_PHASE: ${{ inputs.phase }}
          GATE_SHARD_INDEX: ${{ inputs.shard-index }}
          GATE_SHARD_COUNT: ${{ inputs.shard-count }}
          VITE_SUPABASE_URL: https://testproj.supabase.co
          VITE_SUPABASE_ANON_KEY: testkey
        run: |
          baseline="$GITHUB_WORKSPACE"
          if [ "$GATE_PHASE" = papers ]; then baseline="$RUNNER_TEMP/faultline-live"; fi
          bash scripts/gate.sh full "$GITHUB_WORKSPACE" 5191 "$baseline" 5193 "$RUNNER_TEMP/release-gate"
      - name: Report verification results
        if: always()
        run: |
          cat "$RUNNER_TEMP/release-gate/summary.txt" 2>/dev/null || true
          for log in "$RUNNER_TEMP/release-gate/"*.log; do
            if grep -Eq '^FAIL|^MISSING|Error:|TimeoutError|NOT accepted|acceptance check.*failed' "$log"; then
              echo "::group::$(basename "$log")"
              tail -n 100 "$log"
              echo '::endgroup::'
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ inputs.phase }}-${{ inputs.shard-index }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-gate/
            ${{ runner.temp }}/*vite.log
          if-no-files-found: warn
