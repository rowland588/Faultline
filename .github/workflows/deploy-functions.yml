# DEPLOY LUNA'S SERVER FUNCTIONS FROM THE REPOSITORY (11 November). The AI service (`assist`, eleven files, ~330 KB) has outgrown
# being typed into a deploy call by hand, so it is deployed the standard way: the Supabase CLI uploads the files exactly as they are
# in the repository. It runs when main changes a function's files, or by hand (Actions › Deploy server functions › Run workflow).
#
# Needs ONE repository secret, set once by the owner: SUPABASE_ACCESS_TOKEN — a personal access token from the Supabase dashboard
# (Account › Access Tokens). It never appears in the app, in a log or in a commit. Without it, the job stops at its first step and
# says so; nothing is deployed and the live functions are untouched.
#
# Before deploying, the gateway's copies are checked against the app's own sources (scripts/sync-assist.mjs): a copy that has drifted
# fails the job, so the live AI service always runs the same words, schemas and checks the app was tested with.
name: Deploy server functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      function:
        description: 'Which function (assist, ingest, remind, or all)'
        required: true
        default: 'all'

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: eqdigvzbljofxznqtfia
    steps:
      - name: The access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set in the repository's secrets — nothing deployed."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The gateway's copies match the app's sources
        run: |
          node scripts/sync-assist.mjs
          git diff --exit-code -- supabase/functions || { echo "::error::A gateway copy differs from its source — run node scripts/sync-assist.mjs and commit."; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        run: |
          WHICH="${{ github.event.inputs.function || 'all' }}"
          deploy() {
            # assist checks the caller's session itself AND keeps JWT verification on; ingest authenticates by its own token
            # and the database's key, so JWT verification is off for it (supabase/functions/ingest, docs/DATA-CONNECTIONS.md).
            case "$1" in
              ingest) supabase functions deploy ingest --project-ref "$PROJECT_REF" --no-verify-jwt ;;
              remind) supabase functions deploy remind --project-ref "$PROJECT_REF" --no-verify-jwt ;;
              *)      supabase functions deploy "$1" --project-ref "$PROJECT_REF" ;;
            esac
          }
          if [ "$WHICH" = "all" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.before || 'HEAD~1' }}" HEAD -- supabase/functions 2>/dev/null | cut -d/ -f3 | sort -u)
            [ -z "$CHANGED" ] && CHANGED="assist ingest"
            for f in $CHANGED; do [ -f "supabase/functions/$f/index.ts" ] && deploy "$f"; done
          else
            deploy "$WHICH"
          fi
          supabase functions list --project-ref "$PROJECT_REF"
