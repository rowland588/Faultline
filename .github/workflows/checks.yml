# Every push and every pull request. The repository had no CI at all, which is
# how four separate schema drifts reached the live database unnoticed — each one
# silently stopping a table from syncing, with nothing on screen to say so.
name: checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Typecheck and tests are separate steps on purpose: when this goes red,
      # the step name alone says whether it is a type error or a broken
      # invariant, without opening the log.
      - name: Typecheck
        run: npx tsc --noEmit

      # --max-warnings pins the ceiling: 0 errors, and no NEW warnings. The
      # existing ones are a backlog (mostly non-null assertions), not a gate.
      - name: Lint
        run: npx eslint src --max-warnings 66

      - name: Tests
        run: npx vitest run

      # The live database is where drift bites. With the two Supabase values in
      # the repository's secrets this reads the live API's schema and fails on
      # a column the app writes that the cloud has not got; without them the
      # script says "skipped" and passes.
      - name: Live schema
        run: node scripts/check-live-schema.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # The build also runs check-env, so a missing environment variable is
      # caught here rather than by a white screen in production.
      - name: Build
        run: npx vite build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
