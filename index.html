          <h1>Faultline — the control room for change on your lines</h1>
          <p>Show the business a formal process, and that you are in control of every change on your lines.</p>
          <h2>Three kinds of change, one control room</h2>
          <ul>
            <li><strong>Stage gate</strong> — new equipment taken through Install, Set up, Commission and Hand over: tests against what was agreed, fixes, what it waits on, with the supplier.</li>
            <li><strong>3P</strong> — a running line improved week by week on the board, actions sorted People, Plant and Process, each with an owner and a date.</li>
            <li><strong>Lever tree</strong> — one outcome worked down to what has to be true for it, each condition's colour following its number or its work.</li>
          </ul>
          <p>Every change is measured before and after. One view across every line and job answers "am I in control?" — what is late, who owes what by when — and each change has a client report, on screen and as a PDF, in the same words as the screens.</p>
