          <h1>Faultline — run the improvement project, and prove it moved</h1>
          <p>Every improvement plan looks good on a slide. Every win sounds good in a meeting. Faultline makes them prove it.</p>
          <p>Faultline is where a factory runs its improvement work — and the only system where that work has to prove itself. Run the whole initiative in one place: the plan, the owners, the filmed evidence and the weekly numbers — then let every result be checked against the weeks it claims to have changed.</p>
          <h2>The four steps</h2>
          <ul>
            <li><strong>The plan, on one page.</strong> The outcome, what has to be true for it, the conditions underneath and the work below that — a lever tree you can put on a wall, and it prints into the report.</li>
            <li><strong>The work, from where it already lives.</strong> Actions come off the tracker your team already fills in. No retyping, no second list to keep.</li>
            <li><strong>The line, filmed where it hurts.</strong> Walk it with a phone and pin the faults on the footage. The evidence outlives the video.</li>
            <li><strong>Proved against the weeks — or not.</strong> A win is checked against that line's own weekly rate, both week counts shown. The verdict is allowed to say not proven, or worse.</li>
          </ul>
          <p>Offline-first on the phones you already own — works with no signal on the floor, then syncs to every teammate you invite. No sensors, no integrations, no IT project.</p>
          <p><a href="/how-it-works.html">See how it works — real screens, two minutes</a></p>
        </main>
      </noscript>
