          <h1>Faultline — factory improvement software that proves the saving</h1>
          <p>OEE systems have numbers and no eyes. Audit apps have eyes and no numbers. Faultline has both.</p>
          <p>Faultline is where a factory runs its improvement work — and the only system where that work has to prove itself. One discipline for food-manufacturing ops teams: see the loss, price it in pounds, fix it, and prove the fix held — with receipts a finance director believes.</p>
          <h2>The four verbs</h2>
          <ul>
            <li><strong>See it — both ways.</strong> Time the losses with a stopwatch; film the line and pin the faults on the footage.</li>
            <li><strong>Price it in pounds.</strong> Every lost minute meets your crew cost. The Pareto ranks the pain in £/week.</li>
            <li><strong>Fix it — owned and dated.</strong> Every action carries a name and a due date, and lands in a Monday meeting that runs itself.</li>
            <li><strong>Prove it held — or admit it didn't.</strong> A study re-measures the same scope the same way. The verdict can be ✗ — which is exactly why a ✓ is a receipt, not a claim.</li>
          </ul>
          <p>Offline-first on the phones you already own — works with no signal on the floor, then syncs to every teammate you invite. No sensors, no integrations, no IT project.</p>
          <p><a href="/how-it-works.html">See how it works — real screens, two minutes</a></p>
